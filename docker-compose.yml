# PrintBar — Local Development Docker Compose
# 
# Services:
#   backend  — FastAPI (port 8000) with hot-reload
#   postgres — PostgreSQL 16 (port 5432)
#   redis    — Redis 7 (port 6379)
#   nginx    — Reverse proxy (port 80)
#
# The frontend (Vite/React) runs natively on the host with `npm run dev`
# because it lives at the repo root and requires the host Node.js environment.
#
# Quick start:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker compose up -d postgres redis
#   3. Run backend: cd apps/backend && pip install -r requirements/dev.txt && uvicorn app.main:app --reload
#   OR  docker compose up -d  (backend only, without frontend service)
#   4. Run frontend: npm install && npm run dev
#
# All secrets are supplied via .env — never commit .env

services:

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: builder  # builder stage includes pip deps for dev hot-reload
    image: printbar-backend:dev
    container_name: printbar-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point to the Docker postgres service.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-printbar}:${POSTGRES_PASSWORD:-printbar_dev_password}@postgres:5432/${POSTGRES_DB:-printbar_dev}
      # Override REDIS_URL to point to the Docker redis service.
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_ECHO: "false"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:80"
      PYTHONPATH: /app
    volumes:
      # Mount source code for hot-reload during development.
      - ./apps/backend:/app
    command: >
      python -m uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - printbar-network

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: printbar-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printbar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printbar_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-printbar_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printbar} -d ${POSTGRES_DB:-printbar_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - printbar-network

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: printbar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - printbar-network

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  # Nginx proxies /api/* → backend, everything else → host frontend (5173).
  # Run after starting the frontend dev server on your host.
  nginx:
    image: nginx:1.27-alpine
    container_name: printbar-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security.conf:/etc/nginx/snippets/security.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - printbar-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  printbar-network:
    driver: bridge
