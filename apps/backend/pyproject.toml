[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires running services)",
    "slow: Tests that take more than 1 second",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic",
    "ignore::DeprecationWarning:jose",
    "ignore::pytest_asyncio.plugin.PytestDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "T20", # no print statements
    "SIM", # flake8-simplify
]
ignore = [
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "ANN401", # Dynamically typed expressions
    "S105",   # Hardcoded password (false positives in tests)
    "S106",   # Hardcoded password (false positives in tests)
    "S311",   # Standard pseudo-random generators (not crypto)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "T20"]  # Relax security and annotation checks in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*", "tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
