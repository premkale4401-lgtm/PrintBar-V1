# PrintBar — Nginx Development Configuration
#
# Routes:
#   /health, /live, /ready → FastAPI backend health endpoints
#   /api/*                  → FastAPI backend (HTTP)
#   /ws/*                   → FastAPI WebSocket (upgrade)
#   /docs, /redoc, /openapi.json → FastAPI interactive docs (dev only)
#   /                       → Frontend dev server (host:5173 or localhost:5173)
#
# In Docker, frontend runs on the HOST at port 5173.
# host-gateway resolves to the Docker host machine's IP.

upstream backend {
    server backend:8000;
    keepalive 32;
}

# Frontend dev server runs on host machine port 5173.
# 'host-gateway' is the Docker internal hostname for the host machine.
upstream frontend {
    server host-gateway:5173;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    # ─── Security Headers ─────────────────────────────────────────────────────
    include /etc/nginx/snippets/security.conf;

    # ─── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ─── Client Settings ──────────────────────────────────────────────────────
    client_max_body_size 30m;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # ─── Health Endpoints ─────────────────────────────────────────────────────
    location ~ ^/(health|ready|live)$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        access_log off;
    }

    # ─── API Routes ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ─── WebSocket Upgrade ────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # ─── OpenAPI Docs (Development Only) ─────────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # ─── Vite HMR WebSocket ───────────────────────────────────────────────────
    location /@vite/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ─── Frontend (All Other Routes) ──────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
